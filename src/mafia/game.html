<style>
:root{
  --sil-far:#1c1610; --sil-near:#130f0b; --sil-fig:#050403;
  --bg:#0e0b09; --card:#1a1410; --card2:#241c15; --line:#352a20; --line2:#4a3b2c;
  --ink:#f3e9d6; --muted:#a8977e;
  --red:#d42a3a; --red2:#8e1220; --gold:#d9ad55; --green:#4cc46f; --blue:#9cc2ff;
  --night:#0a1222; --moon:#efe9d6;
  --paper:#efe5cf; --paper-ink:#1d1812;
  --r:14px;
  --display:'Limelight', Georgia, serif;
  --head:'Playfair Display', Georgia, serif;
  --type:'Special Elite', 'Courier New', monospace;
  --ui:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.4}
body{min-height:100vh;min-height:100dvh;transition:background .6s}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blinds{position:absolute;left:-30%;right:-30%;top:-10%;height:75%;background:repeating-linear-gradient(-24deg,rgba(255,230,190,.045) 0 16px,transparent 16px 44px);-webkit-mask-image:radial-gradient(ellipse 60% 70% at 75% 15%,#000,transparent 70%);mask-image:radial-gradient(ellipse 60% 70% at 75% 15%,#000,transparent 70%)}
.city{position:absolute;left:0;right:0;bottom:0;width:100%;height:46vh;max-height:420px}
.city .far{fill:var(--sil-far)}.city .near{fill:var(--sil-near)}.city .win{fill:var(--gold);opacity:.22}
.city .post{fill:#090706;stroke:#090706}.city .fig{fill:var(--sil-fig)}
.city .smoke{stroke:#efe2c8;stroke-opacity:.14;fill:none;animation:smoke 6s ease-in-out infinite}
@keyframes smoke{0%,100%{stroke-opacity:.05;transform:translateY(0)}50%{stroke-opacity:.16;transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.city .smoke{animation:none}}
body.night{--sil-far:#13203d;--sil-near:#0c1529;--sil-fig:#03060d}
body.night .blinds{opacity:.6}
.rec{font-size:13px;color:var(--muted);margin:6px 0 10px}.rec b{color:var(--ink)}
.hand{font-size:64px;text-align:center;margin:18px 0 4px}
.rsel{flex:none;background:var(--card2);color:var(--ink);border:1px solid var(--line2);border-radius:9px;padding:6px 8px;font:600 13px var(--ui)}
.rsel.r-mafia{border-color:var(--red);color:#ff8f99}.rsel.r-angel{border-color:#3b67ad;color:#9cc2ff}.rsel.r-sheriff{border-color:var(--gold);color:var(--gold)}
body.night{background:radial-gradient(900px 520px at 85% -10%,#1d2e57 0%,var(--night) 60%) fixed var(--night)}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
body.host #app{max-width:720px}
a{color:var(--gold)}
.logo{font-family:var(--display);font-size:68px;letter-spacing:.06em;text-align:center;margin:30px 0 0;line-height:1;text-shadow:0 3px 0 var(--red2)}
.logo.sm{font-size:40px;margin-top:10px}
.tag{font-family:var(--type);text-align:center;color:var(--muted);margin:10px 0 22px}
h2{font-family:var(--head);font-weight:900;font-size:26px;margin:4px 0 8px;line-height:1.15}
h3{font-family:var(--head);font-weight:700;font-size:18px;margin:0 0 8px}
p{margin:8px 0}
.center{text-align:center}
.muted{color:var(--muted)} .small{font-size:13px}
.err{color:#ff8f8f;font-weight:600} .warn{color:#f5c46b} .tred{color:#ff6b77}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.warnp{border-color:#8a6a24;background:#21190c}
.btn{display:block;width:100%;appearance:none;border-radius:12px;padding:15px 18px;font:600 17px/1.2 var(--ui);background:var(--card2);color:var(--ink);border:1px solid var(--line2);cursor:pointer;text-align:center;margin:8px 0}
.btn.red{background:linear-gradient(180deg,#d8323f,#a3141f);border-color:#e04a55;color:#fff}
.btn.gold{background:linear-gradient(180deg,#e2b862,#b48a33);color:#1b140a;border-color:#e9c77d}
.btn.ghost{background:transparent}
.btn.sm{display:inline-block;width:auto;padding:9px 13px;font-size:14px;margin:4px 6px 4px 0}
.btn.big{font-size:19px;padding:18px;margin-top:14px}
.btn:disabled{opacity:.4;cursor:default}
.btn:active:not(:disabled){transform:translateY(1px)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.center{justify-content:center}
.say{font-family:var(--type);background:rgba(0,0,0,.35);border-left:3px solid var(--gold);padding:10px 12px;border-radius:6px;color:#efe2c4;margin:12px 0;font-size:15px;line-height:1.45}
.say::before{content:'SAY';display:block;font:700 10px/1 var(--ui);letter-spacing:.18em;color:var(--gold);margin-bottom:6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.tile{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--card2);border:1px solid var(--line2);color:var(--ink);font:600 16px var(--ui);text-align:left;cursor:pointer;min-height:58px;min-width:0}
.tile.on{border-color:var(--gold);background:#3a2b17;box-shadow:0 0 0 2px var(--gold) inset}
.tile:disabled{opacity:.3}
.tn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{flex:none;width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font:700 15px var(--ui);background:hsl(var(--h) 30% 26%);color:hsl(var(--h) 60% 84%)}
.chip{display:inline-flex;align-items:center;padding:7px 11px;border-radius:999px;background:var(--card2);border:1px solid var(--line2);color:var(--ink);font:600 14px var(--ui);margin:3px 5px 3px 0;cursor:pointer}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font:700 11px/1.6 var(--ui);letter-spacing:.06em;text-transform:uppercase;vertical-align:middle}
.b-mafia{background:var(--red);color:#fff}.b-angel{background:#2b4f86;color:#dfeaff}.b-sheriff{background:var(--gold);color:#1b140a}.b-town{background:#4a4033;color:#efe4cf}
.prow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow.is-dead .tn{opacity:.5;text-decoration:line-through}
.x{background:none;border:0;color:var(--muted);font-size:24px;line-height:1;padding:0 6px;cursor:pointer}
.ok{color:var(--green);font-weight:800}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:#5c5246;flex:none}
.dot.on{background:var(--green);box-shadow:0 0 8px var(--green)}
.dot.warn{background:#e0a72e}
.hbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 0 8px;border-bottom:1px solid var(--line)}
.hroom{font:700 13px var(--ui);letter-spacing:.12em;color:var(--muted)} .hroom b{color:var(--ink);font-size:16px}
.ib{background:var(--card2);border:1px solid var(--line2);color:var(--ink);border-radius:9px;padding:7px 10px;font:600 13px var(--ui);cursor:pointer}
.ib.on{background:var(--gold);color:#1b140a;border-color:var(--gold)}
.phase{font-family:var(--head);font-weight:900;font-size:30px;margin:14px 0 2px}
.pbar{display:flex;justify-content:space-between;align-items:center;font:600 13px var(--ui);color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
.pbar .me{display:flex;align-items:center;gap:8px;color:var(--ink)}
.status{font:600 13px var(--ui);text-align:center;padding:9px;border-radius:10px;background:#3a2c14;color:#f5d48e;margin-bottom:10px}
.roomcode{font:900 60px/1 var(--head);letter-spacing:.18em;text-align:center;margin:4px 0 8px;padding-left:.18em}
.qr{background:#f7f0e1;padding:10px;border-radius:12px;width:190px;margin:10px auto}
.qr svg{display:block;width:100%;height:auto}
input.in{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line2);background:#120e0b;color:var(--ink);font:600 18px var(--ui);outline:none}
input.in:focus{border-color:var(--gold)}
input.code{text-transform:uppercase;letter-spacing:.4em;text-align:center;font-family:var(--head);font-size:28px}
.lb{display:block;font:700 12px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.deckrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.step{display:flex;align-items:center;gap:12px}
.step button{width:40px;height:40px;border-radius:10px;background:var(--card2);border:1px solid var(--line2);color:var(--ink);font:700 20px var(--ui);cursor:pointer}
.step b{min-width:20px;text-align:center;font-size:20px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 12px;border-radius:10px;background:var(--card2);border:1px solid var(--line2);color:var(--ink);font:600 14px var(--ui);cursor:pointer}
.seg button.on{background:var(--gold);color:#1b140a;border-color:var(--gold)}
.setrow{margin-top:8px}
summary{padding:2px 0}
details[open] summary{margin-bottom:8px}
.rules ol{padding-left:20px;margin:6px 0}.rules li{margin:8px 0;color:#e3d7bf}
.secret{position:relative;border-radius:14px;border:1px dashed var(--line2);background:rgba(0,0,0,.35);padding:14px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;cursor:pointer;min-height:70px;margin:12px 0}
.secret .sb{visibility:hidden}
.secret .sc{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:600 14px var(--ui);color:var(--muted);padding:10px}
.secret.show{border-style:solid;border-color:var(--gold)}
.secret.show .sb{visibility:visible}.secret.show .sc{display:none}
.peek{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;cursor:pointer;text-align:center}
.peek .face{display:none}.peek.show .face{display:block}.peek.show .backc{display:none}
.peekhint{font:600 14px var(--ui);color:var(--muted);margin-top:4px}.peek.show .peekhint{display:none}
.pcard{width:180px;height:252px;margin:10px auto;border-radius:14px;background:#f7f0e1;color:#141110;position:relative;box-shadow:0 12px 30px rgba(0,0,0,.6);display:grid;place-items:center;font-family:var(--head)}
.pcard.red{color:#b3121f}
.pcard .corner{position:absolute;font:900 21px/.95 var(--head);text-align:center}
.pcard .tl{top:10px;left:11px}.pcard .br{bottom:10px;right:11px;transform:rotate(180deg)}
.pc-mid{text-align:center}
.pcard.fc .pc-mid{border:2px solid currentColor;border-radius:8px;padding:14px 12px;min-width:118px}
.pc-suit{font-size:70px;line-height:1}
.pc-rank{font:900 46px/1 var(--head);display:block}
.pc-role{font-family:var(--display);font-size:20px;letter-spacing:.06em;margin-top:6px}
.pcard.back{background:repeating-linear-gradient(45deg,#7d0f19 0 8px,#5b0a12 8px 16px);border:8px solid #f1e6cf}
.pc-mono{font-family:var(--display);font-size:70px;color:#f1e6cf;text-shadow:0 2px 0 #000}
.rinfo{text-align:left;background:rgba(0,0,0,.35);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;margin:8px 0}
.rname{font-family:var(--display);font-size:24px;letter-spacing:.05em}
.r-mafia{color:#ff6b77}.r-angel{color:var(--blue)}.r-sheriff{color:var(--gold)}.r-town{color:var(--ink)}
.mcard{display:inline-grid;place-items:center;width:34px;height:46px;border-radius:5px;background:#f7f0e1;color:#141110;font:900 14px/1 var(--head);flex:none}
.mcard.red{color:#b3121f}
.paper{background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:14px 16px 18px;margin:12px 0;box-shadow:0 10px 26px rgba(0,0,0,.55);background-image:radial-gradient(rgba(0,0,0,.05) 1px,transparent 1px);background-size:4px 4px}
.mast{font-family:var(--display);text-align:center;font-size:26px;border-bottom:3px double var(--paper-ink);padding-bottom:6px;letter-spacing:.04em}
.dl{display:flex;justify-content:space-between;font:700 10px var(--ui);text-transform:uppercase;letter-spacing:.1em;border-bottom:1px solid var(--paper-ink);padding:5px 0;margin-bottom:8px}
.hl{font:900 32px/1.02 var(--head);text-transform:uppercase;margin:8px 0 10px;text-align:center;overflow-wrap:anywhere}
.story{font:17px/1.5 var(--type);margin:0}
.timer{font:900 76px/1 var(--head);text-align:center;font-variant-numeric:tabular-nums;margin:6px 0}
.timer.low{color:#ff5a68}.timer.done{color:var(--muted)}
.moon{width:54px;height:54px;border-radius:50%;background:var(--moon);box-shadow:inset -14px 6px 0 0 #c9c2a8,0 0 44px rgba(239,233,214,.35);margin:6px auto 10px}
body.night .tile{background:#13213d;border-color:#22345c}
body.night .tile.on{background:#2a3350;box-shadow:0 0 0 2px var(--moon) inset;border-color:var(--moon)}
body.night .panel{background:rgba(15,26,49,.9);border-color:#22345c}
body.night .secret{background:rgba(6,12,26,.6);border-color:#2a3d66}
body.night .btn:not(.red):not(.gold){background:#13213d;border-color:#2a3d66}
.kicker{font:800 12px var(--ui);letter-spacing:.24em;text-transform:uppercase;color:#ff6b77;text-align:center;margin-top:14px}
.versus{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;font:900 32px/1.1 var(--head);text-align:center;margin:8px 0 6px}
.vs{font-family:var(--display);color:#ff6b77;font-size:20px}
.bar{display:flex;align-items:center;gap:8px;margin:7px 0;width:100%;background:none;border:0;color:inherit;font:inherit;padding:0;text-align:left}
button.bar{cursor:pointer}
.bar .bn{width:34%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bar .bt{flex:1;height:24px;background:rgba(0,0,0,.4);border-radius:6px;overflow:hidden}
.bar .bf{display:block;height:100%;background:var(--red);border-radius:6px;transition:width .3s}
.bar.sel .bf{background:var(--gold)}
.bar.sel .bn{color:var(--gold)}
.bar .bc{width:26px;text-align:right;font-weight:800}
.win{text-align:center;padding:22px 16px;border-radius:14px;margin:12px 0}
.win.mafia{background:linear-gradient(180deg,#8a1220,#3b070c)}
.win.town{background:linear-gradient(180deg,#a37a2c,#4f3b12)}
.win.none{background:var(--card2)}
.win h2{font-family:var(--display);font-weight:400;font-size:36px;letter-spacing:.05em}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cardrow{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:var(--card2);min-width:0}
.cf{border-left:2px solid var(--line2);padding:4px 0 8px 12px;margin:8px 0;font-size:14px;color:#e3d7bf}
.cfh{font:700 12px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;border-radius:999px;padding:12px 18px;background:#f1e6cf;color:#1a1410;font:700 15px var(--ui);border:0;box-shadow:0 6px 20px rgba(0,0,0,.6);cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(5,4,3,.96);z-index:50;overflow:auto;padding:16px}
.ov .in{max-width:560px;margin:0 auto;padding-top:20px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#f1e6cf;color:#1a1410;padding:11px 15px;border-radius:10px;font:600 14px var(--ui);z-index:60;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.6);text-align:center}
.spinner{width:34px;height:34px;border:3px solid var(--line2);border-top-color:var(--gold);border-radius:50%;margin:24px auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.locked{font-family:var(--head);font-weight:900;font-size:24px;text-align:center;margin:18px 0 4px}
.gm{transition:filter .12s}
body.blur .gm:not(:active){filter:blur(7px)}
.ghost{text-align:center;padding:28px 10px}
.ghost .g{font-size:54px;line-height:1}
summary{cursor:pointer}
@media (max-width:340px){.tiles{grid-template-columns:1fr}.cards{grid-template-columns:1fr}}
@media (max-width:400px){.logo{font-size:56px}.tile{padding:10px;gap:8px;font-size:15px}}
</style>
</head>

<script>
'use strict';
// ============================================================
// Mafia: one narrator phone hosts the game, players join by room code.
// Transport: PeerJS (WebRTC data channels). The narrator's browser holds
// the whole game state; each player only ever receives their own view.
// ============================================================

const PREFIX = 'antonmafia1-';
const ALPHA = 'BCDFGHJKLMNPQRSTVWXZ';
const qs = new URLSearchParams(location.search);
const NS = qs.get('as') ? ':' + qs.get('as') : ''; // lets one browser hold several test seats

function statsLines(hist, players) {
  const lines = []; const hits = {}, tries = {}, nomc = {};
  for (const e of hist) {
    if (e.type === 'night') for (const [p, t] of Object.entries(e.hunch || {})) if (t) { tries[p] = (tries[p] || 0) + 1; if (players[t] && players[t].role === 'mafia') hits[p] = (hits[p] || 0) + 1; }
    if (e.type === 'day') for (const ts of Object.values(e.noms || {})) for (const t of ts) nomc[t] = (nomc[t] || 0) + 1;
  }
  const best = Object.keys(tries).sort((a, b) => (hits[b] || 0) - (hits[a] || 0) || tries[a] - tries[b])[0];
  if (best && hits[best]) lines.push(`Best hunches: <b>${esc(NM(best))}</b> (${hits[best]}/${tries[best]})`);
  const mn = Object.keys(nomc).sort((a, b) => nomc[b] - nomc[a])[0];
  if (mn) lines.push(`Most accused: <b>${esc(NM(mn))}</b> (${nomc[mn]})`);
  const ex = hist.filter(e => e.type === 'day' && e.victim);
  const mex = ex.filter(e => players[e.victim] && players[e.victim].role === 'mafia').length;
  if (ex.length) lines.push(`Town executed ${mex} mafia, ${ex.length - mex} innocent`);
  const saves = hist.filter(e => e.type === 'night' && e.saved).length;
  if (saves) lines.push(`Angel saves: ${saves}`);
  return lines;
}

}

function playIntro() {

    const cr = noise(4.6, () => Math.random() < 0.0012 ? (Math.random() * 2 - 1) * 0.7 : (Math.random() * 2 - 1) * 0.01);
    const crf = AC.createBiquadFilter(); crf.type = 'highpass'; crf.frequency.value = 1200;
    const crg = AC.createGain(); crg.gain.setValueAtTime(0.0001, t0); crg.gain.linearRampToValueAtTime(0.35, t0 + 0.4); crg.gain.setValueAtTime(0.35, t0 + 3.7); crg.gain.linearRampToValueAtTime(0.0001, t0 + 4.6);

    click(t + 0.12, 1.1, 1700); click(t + 0.16, 0.8, 2600);

}

function autoMafia(n) { return Math.max(1, Math.floor((n + 1) / 4)); }
// Recommended deck for n players: about one mafia in four (the video's 12 had 3), an angel from 5 up, always a sheriff.
function recommend(n) { return { mafia: autoMafia(n), angel: n >= 5 ? 1 : 0, sheriff: 1 }; }
function manualRoles(st) { const s = st.settings; if (s.autoRoles === 0) return; const r = recommend(st.order.length); s.mafia = r.mafia; s.angel = r.angel; s.sheriff = r.sheriff; s.autoRoles = 0; }

  if (st.settings.dealMode === 'pick') { const c = { mafia: 0, angel: 0, sheriff: 0, town: 0 }; for (const id of st.order) c[(st.assign || {})[id] || 'town']++; return c; }
  if (st.settings.autoRoles !== 0) { const r = recommend(n); return { ...r, town: n - r.mafia - r.angel - r.sheriff }; }
  const m = mafiaCount(st), a = st.settings.angel ? 1 : 0, sh = st.settings.sheriff ? 1 : 0;

}

      store.del('mafia-host'); H.st = null; H.conns.clear(); H.drawer = null; MODE = 'home';

    }

}

// ---- pass-the-phone: collect a ballot on the narrator's own phone ----
function ptpPending() {
  const st = H.st, k = H.ptp.kind;
  if (k === 'deal') return st.order.filter(id => !st.ready[id]);
  if (k === 'nom' && st.nom) return alive().filter(id => !st.nom.ballots[id]);
  if (k === 'vote' && st.vote) return alive().filter(id => !st.vote.ballots[id]);
  return [];
}
function ptpAct(cmd, v) {
  const x = H.ptp; if (!x) return;
  switch (cmd) {
    case 'who': x.pid = v; x.stage = 'hand'; x.sel = []; break;
    case 'go': x.stage = 'ballot'; break;
    case 'list': x.stage = 'list'; x.pid = null; break;
    case 'close': H.ptp = null; break;
    case 'pick': {
      if (x.kind === 'nom') { const k = nomNeed(); if (x.sel.includes(v)) x.sel = x.sel.filter(t => t !== v); else { x.sel.push(v); if (x.sel.length > k) x.sel.shift(); } }
      else x.sel = [v];
      break;
    }
    case 'submit': {
      const e = x.kind === 'deal' ? act(x.pid, 'ready') : x.kind === 'nom' ? act(x.pid, 'nom', { picks: x.sel }) : act(x.pid, 'vote', { target: x.sel[0] });
      if (e) return toast(e);
      x.stage = 'done'; break;
    }
  }
  window.scrollTo(0, 0); render();
}
function ptpHTML() {
  const st = H.st, x = H.ptp; const nm = esc(NM(x.pid));
  if (x.stage === 'list') {

    return `<div class="phase">Pass the phone</div>${pend.length ? tiles(pend, { act: 'ptp:who' }) : '<p>Everyone\'s done.</p>'}<button class="btn" data-a="ptp:close">Back</button>`;
  }
  if (x.stage === 'hand') return `<div class="center" style="padding-top:40px"><div class="muted">Give the phone to</div><h2 style="font-size:42px">${nm}</h2>
      <button class="btn gold big" data-a="ptp:go">I'm ${nm}</button><button class="btn ghost" data-a="ptp:list">Wrong person</button></div>`;
  if (x.stage === 'done') return `<div class="center" style="padding-top:60px"><h2>Done ✓</h2><p class="muted">Hand it back.</p><button class="btn" data-a="ptp:list">Next person</button></div>`;
  const p = st.players[x.pid];
  if (x.kind === 'deal') {
    const me = { card: p.card, role: p.role, crew: st.order.filter(id => id !== x.pid && st.players[id].role === 'mafia') };
    return `<h2 class="center">${nm}</h2>${cardPeek(me, 'ptpcard')}<button class="btn gold" data-a="ptp:submit">Got it</button>`;
  }
  if (x.kind === 'nom') {
    const k = nomNeed(); const ids = alive().filter(id => st.settings.selfNominate || id !== x.pid);
    return `<h2>${nm}: pick ${k}</h2>${tiles(ids, { sel: x.sel, act: 'ptp:pick' })}<button class="btn red" data-a="ptp:submit" ${x.sel.length === k ? '' : 'disabled'}>Submit</button>`;
  }
  return `<h2>${nm}: vote</h2>${tiles(st.vote.options, { sel: x.sel, act: 'ptp:pick' })}<button class="btn red" data-a="ptp:submit" ${x.sel.length ? '' : 'disabled'}>Vote</button>`;
}

document.addEventListener('click', e => {
  unlockAudio(); playIntro();
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  e.preventDefault();
  const a = el.dataset.a, v = el.dataset.v || ''; const [ns, cmd] = a.split(':');
  if (ns === 'home') homeAct(cmd); else if (ns === 'h') hostAct(cmd, v); else if (ns === 'ptp') ptpAct(cmd, v); else if (ns === 'p') playerAct(cmd, v);
});
document.addEventListener('change', e => {
  const el = e.target.closest('select[data-assign]'); if (!el || MODE !== 'host') return;
  H.st.assign = H.st.assign || {}; H.st.assign[el.dataset.assign] = el.value; commit();
});
document.addEventListener('submit', e => {
  e.preventDefault(); const f = e.target.dataset.f; if (!f) return; const [ns, cmd] = f.split(':');
  if (ns === 'home') homeAct(cmd); else if (ns === 'h') hostAct(cmd, '');
});
// Press-and-hold reveals. Releasing anywhere hides it again.
document.addEventListener('pointerdown', e => { unlockAudio(); playIntro(); const el = e.target.closest('[data-hold]'); if (el) { HOLD = el.dataset.hold; el.classList.add('show'); } });
const unhold = () => { if (!HOLD) return; HOLD = null; document.querySelectorAll('[data-hold].show').forEach(x => x.classList.remove('show')); };
document.addEventListener('pointerup', unhold); document.addEventListener('pointercancel', unhold); window.addEventListener('blur', unhold);
document.addEventListener('contextmenu', e => { if (e.target.closest('[data-hold]')) e.preventDefault(); });
document.addEventListener('touchstart', e => { if (e.target.closest('[data-hold]')) e.preventDefault(); }, { passive: false });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  keepAwake();
  if (MODE === 'player' && !P.stopped && !(P.conn && P.conn.open)) { clearTimeout(reT); reT = null; P.connecting = false; pConnect(); }
  if (MODE === 'host' && H.peer && H.peer.disconnected && !H.peer.destroyed) { try { H.peer.reconnect(); } catch (e) {} }
});

// Clocks: discussion and defense timers, shared by host and players.
const beeped = new Set(), buzzed = new Set();
function fmt(ms) { const s = Math.ceil(ms / 1000), m = Math.floor(s / 60); return m ? `${m}:${String(s % 60).padStart(2, '0')}` : String(s); }
function tick() {
  const t = MODE === 'host' ? H.st && H.st.timer : P.v && P.v.timer; const off = MODE === 'host' ? 0 : P.offset;
  const els = document.querySelectorAll('[data-timer]');
  if (!t) { els.forEach(el => el.textContent = ''); return; }
  const now = Date.now() + off, end = t.start + t.dur * 1000, ms = Math.max(0, end - now);
  els.forEach(el => { el.textContent = ms ? fmt(ms) : "Time's up"; el.classList.toggle('low', ms > 0 && ms <= 5000); el.classList.toggle('done', ms === 0); });
  const s = Math.ceil(ms / 1000);
  if (ms > 0 && s <= 3) { const k = t.id + ':' + s; if (!beeped.has(k)) { beeped.add(k); beep(880, 0.08); } }
  if (ms === 0 && !buzzed.has(t.id)) { buzzed.add(t.id); if (now - end < 3000) buzz(); }
}
setInterval(tick, 200);

// Heartbeats. Players ping the narrator; a silent link gets rebuilt.
setInterval(() => {
  if (MODE !== 'player' || P.stopped) return;
  if (P.conn && P.conn.open) {
    try { P.conn.send({ t: 'ping' }); } catch (e) {}
    if (Date.now() - P.lastPong > 12000) { const c = P.conn; P.conn = null; try { c.close(); } catch (e) {} P.status = 'reconnecting'; P.connecting = false; render(); pConnect(); }
  } else if (!P.connecting) schedule();
}, 4000);
let lastDots = '';
setInterval(() => {
  if (MODE !== 'host' || !H.st) return;
  const sig = H.st.order.map(id => isConn(id) ? 1 : 0).join('');
  if (sig !== lastDots) { lastDots = sig; const ae = document.activeElement; if (!(ae && ae.tagName === 'INPUT')) renderSoon(); }
}, 3000);

// ============================================================
// BOOT
// ============================================================
(function boot() {
  const hostRoom = (qs.get('host') || '').toUpperCase();
  const room = (qs.get('room') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
  if (hostRoom) { const s = store.get('mafia-host'); if (s && s.room === hostRoom) { H.st = s; enterHost(); return; } }
  if (room.length === 4) {
    P.room = room; const seat = store.get('mafia-seat-' + room);
    if (seat && seat.token) { P.token = seat.token; P.name = seat.name; pStart(); return; }
    MODE = 'join'; render(); return;
  }
  MODE = 'home'; render();
})();
</script>
</body>
